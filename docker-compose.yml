services:
  backend:
    image: 905418072258.dkr.ecr.ap-south-1.amazonaws.com/voicebots:latest
    pull_policy: always
    restart: unless-stopped
    init: true
    env_file:
      - .env
    environment:
      PORT: "8000"
    ports:
      - "8000:8000"
    stop_grace_period: 60s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
